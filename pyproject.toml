[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dasr-har"
version = "1.0.0"
description = "Reproduction code for Duration-Aware State Recovery for multi-sensor HAR"
requires-python = ">=3.11"
dependencies = [
  "numpy==1.26.4",
  "pandas==2.2.1",
  "PyYAML==6.0.1",
  "scipy==1.12.0",
  "scikit-learn==1.4.1.post1",
  "matplotlib==3.8.3",
  "torch==2.2.1",
  "tqdm==4.66.2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

